<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ComdataSheet — Electronic Equipment, Servos, Sensors and others</title>
  <meta name="description" content="ComdataSheet: Electronic Equipment, Servos, Sensors and others. Barang import original dengan harga mengikuti kurs hari ini.">
  <link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg">
  <link rel="apple-touch-icon" href="assets/logo-icon-512.png">
  <meta property="og:image" content="assets/logo-icon-512.png">
  <link rel="stylesheet" href="assets/style.css?v=18">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#/"><img src="assets/logo-putih.svg?v=5" alt="ComdataSheet" id="nama-toko"></a>
      <nav class="menu" id="menu" aria-label="Kategori produk">
        <a href="#/" data-kat="" data-i18n="semua">Semua</a>
        <a href="#/kategori/electronic-equipment" data-kat="electronic-equipment">Electronic Equipment</a>
        <a href="#/kategori/servos" data-kat="servos">Servos</a>
        <a href="#/kategori/sensors" data-kat="sensors">Sensors</a>
        <a href="#/kategori/others" data-kat="others">Others</a>
      </nav>
      <div class="pilih-bahasa" role="group" aria-label="Bahasa / Language">
        <button type="button" data-bahasa="id" class="aktif">ID</button><button type="button" data-bahasa="en">EN</button>
      </div>
      <button class="cart-btn" id="buka-keranjang" aria-label="Keranjang / Cart">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <span class="badge" id="jumlah-keranjang">0</span>
      </button>
    </div>
  </header>

  <!-- Halaman daftar produk -->
  <div id="hal-daftar">
    <section class="hero" id="hero">
      <div class="wrap">
        <h1 id="judul-daftar">Barang import original</h1>
        <p class="subjudul" id="subjudul" hidden></p>
        <div class="kurs-box" id="kurs-box" data-i18n="memuat">Memuat kurs…</div>
      </div>
    </section>
    <main class="wrap">
      <div class="toolbar">
        <input type="search" id="cari" placeholder="Cari produk…" data-i18n-ph="cari" aria-label="Cari produk">
        <select id="filter-jenis" aria-label="Jenis supplier">
          <option value="" data-i18n="semua_supplier">Semua supplier</option>
          <option value="import" data-i18n="supplier_import">Supplier import</option>
          <option value="lokal" data-i18n="supplier_lokal">Supplier lokal</option>
        </select>
      </div>
      <div class="grid" id="daftar-produk"></div>
      <p class="kosong" id="kosong" hidden>Belum ada produk di kategori ini.</p>
    </main>
  </div>

  <!-- Halaman detail produk -->
  <main class="wrap detail" id="hal-detail" hidden></main>

  <footer class="footer">
    <div class="wrap">
      <p id="footer-kontak" class="footer-kontak" hidden></p>
      <p id="footer-teks">Harga dihitung otomatis dari harga supplier luar negeri dan kurs terbaru, sehingga dapat berubah sewaktu-waktu. Harga final mengikuti konfirmasi pesanan.</p>
      <p id="link-tokopedia"></p>
    </div>
  </footer>

  <!-- Keranjang -->
  <div class="overlay" id="overlay" hidden></div>
  <aside class="drawer" id="keranjang" aria-hidden="true">
    <div class="drawer-head">
      <h2 data-i18n="keranjang">Keranjang</h2>
      <button class="tutup" id="tutup-keranjang" aria-label="Tutup">&times;</button>
    </div>
    <div class="drawer-body" id="isi-keranjang"></div>
    <form class="checkout" id="form-checkout">
      <div class="total"><span data-i18n="total">Total</span><strong id="total">Rp 0</strong></div>
      <input name="nama" required placeholder="Nama lengkap" data-i18n-ph="f_nama">
      <input name="hp" required placeholder="No. HP / WhatsApp" data-i18n-ph="f_hp" inputmode="tel">
      <textarea name="alamat" required rows="3" placeholder="Alamat lengkap pengiriman" data-i18n-ph="f_alamat"></textarea>
      <textarea name="catatan" rows="2" placeholder="Catatan (opsional)" data-i18n-ph="f_catatan"></textarea>
      <p class="info-bayar" id="info-bayar"></p>
      <button type="submit" class="btn-wa" data-i18n="pesan_wa">Pesan via WhatsApp</button>
    </form>
  </aside>

  <script src="assets/app.js?v=12"></script>
</body>
</html>
