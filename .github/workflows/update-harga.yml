name: Update harga & publikasikan toko

on:
  schedule:
    - cron: "0 */4 * * *" # setiap 4 jam (waktu UTC)
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      abaikan_batas:
        description: "Terapkan harga baru walau berubah melebihi batas_perubahan_persen"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-harga
  cancel-in-progress: false # proses berikutnya menunggu, tidak dibatalkan

jobs:
  update-dan-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # selalu pakai data paling baru, bukan versi saat workflow dipicu

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Hitung ulang harga (kurs + harga supplier)
        env:
          ABAIKAN_BATAS: ${{ inputs.abaikan_batas }}
        run: python scripts/update_prices.py

      - name: Simpan katalog terbaru ke repo
        env:
          ABAIKAN_BATAS: ${{ inputs.abaikan_batas }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Jika ada perubahan lain masuk saat proses berjalan, ambil data terbaru,
          # hitung ulang, lalu coba simpan lagi (maks. 5 kali).
          for percobaan in 1 2 3 4 5; do
            git add data/katalog.json data/internal.json
            if git diff --cached --quiet; then echo "Tidak ada perubahan harga."; exit 0; fi
            git commit -q -m "Update harga otomatis $(date -u '+%Y-%m-%d %H:%M') UTC"
            if git push; then exit 0; fi
            echo "Repo berubah saat proses berjalan, mengulang dengan data terbaru ($percobaan)..."
            sleep $((percobaan * 3))
            git fetch -q origin main
            git reset -q --hard origin/main
            python scripts/update_prices.py
          done
          echo "Gagal menyimpan setelah 5 percobaan."; exit 1

      - name: Siapkan file website (tanpa data supplier & modal)
        run: |
          mkdir -p _site/data
          cp -r index.html admin.html assets _site/
          cp data/katalog.json _site/data/
          if [ -d files ]; then cp -r files _site/; fi
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
